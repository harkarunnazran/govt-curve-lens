[project]
name = "govt-curve-lens"
version = "0.0.1"
readme = "README.md"
authors = [
    { name = "Harkarun Nazran", email = "harkarunsnazran@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "ipykernel",
    "requests",
    "xlrd",
    "openpyxl>=3.1.5",
    "holidays>=0.108",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "hypothesis>=6.170.8",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pylint>=3.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
